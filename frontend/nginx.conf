server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # React Router: cualquier ruta que no sea un archivo cae en index.html.
  location / {
    try_files $uri /index.html;
  }

  # Android App Links: Android pide este archivo (sin redirecciones, como JSON) para
  # verificar que la app puede abrir los enlaces de este sitio. Ver public/.well-known.
  location = /.well-known/assetlinks.json {
    default_type application/json;
    add_header Cache-Control "public, max-age=3600";
  }

  # Los archivos con hash de Vite pueden cachearse para siempre.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
