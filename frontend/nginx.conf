server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # React Router: cualquier ruta que no sea un archivo cae en index.html.
  location / {
    try_files $uri /index.html;
  }

  # Los archivos con hash de Vite pueden cachearse para siempre.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
